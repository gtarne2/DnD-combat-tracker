<section id="encounter" aria-labelledby="encounter-heading">
  <div class="initiative-heading"><h2 id="encounter-heading">Encounter</h2><strong id="round-number">Round 1</strong></div>
  <p id="current-turn"></p>
  <p id="last-attack" hidden></p>

  <div class="initiative-footer">
    <div class="turn-actions">
      <button type="button" id="next-turn">Next Turn</button>
      <button type="button" id="undo-turn" aria-label="Undo combat update" title="Undo combat update" disabled>↶</button>
    </div>
    <span id="encounter-storage"></span>
  </div>
</section>
<dialog id="encounter-settings" aria-labelledby="encounter-settings-heading">
  <div class="dialog-heading"><h2 id="encounter-settings-heading">Manage initiative</h2><form method="dialog"><button>Close</button></form></div>
  <div class="initiative-list"><ol id="turn-order"></ol></div>
      <form class="focus-form" id="encounter-owner">
        <label>Your initiative <input name="initiative" type="number" min="-2147483648" max="2147483647"></label>
        <button>Save initiative</button>
      </form>
      <details class="panel" id="combatant-panel">
        <summary>Add or edit combatant</summary>
        <form class="panel-body focus-form" id="combatant-form">
          <label>Combatant name <input name="name" maxlength="80" required></label>
          <label>Initiative score <input name="score" type="number" min="-2147483648" max="2147483647" required></label>
          <label>Combatant HP <input name="hp" type="number" min="0" max="4294967295"></label>
          <button>Save combatant</button>
          <button type="button" id="cancel-combatant" hidden>Cancel edit</button>
        </form>
      </details>
</dialog>
<dialog id="hp-settings" aria-labelledby="hp-settings-heading">
  <div class="dialog-heading"><h2 id="hp-settings-heading">Set hit points</h2><form method="dialog"><button>Close</button></form></div>
      <p id="encounter-hp">Unavailable</p>
      <form class="focus-form" id="encounter-hp-form">
        <label>Your current HP <input name="current" type="number" min="0" max="4294967295" required></label>
        <label>Your maximum HP <input name="max" type="number" min="0" max="4294967295"></label>
        <label>Temporary HP <input name="temporary" type="number" min="0" max="4294967295" value="0" required aria-describedby="temporary-hp-help"></label>
        <button>Set HP</button>
      </form>
      <p class="focus-feedback" id="temporary-hp-help">Enter the new temporary HP total. It replaces the current amount.</p>
</dialog>
<dialog id="resource-settings" aria-labelledby="resource-settings-heading">
  <div class="dialog-heading"><h2 id="resource-settings-heading">Manage resources</h2><form method="dialog"><button>Close</button></form></div>
          <label>Resource <select id="resource-choice"><option value="">New resource</option></select></label>
          <form class="focus-form" id="encounter-resource-form">
            <label>Resource name <input name="name" maxlength="80" required></label>
            <label>Maximum uses <input name="capacity" type="number" min="1" max="4294967295" required></label>
            <label>Recovers on <select name="recovery"><option value="">Manual reset</option><option value="short">Short or long rest</option><option value="long">Long rest</option></select></label>
            <button>Add resource</button>
          </form>
</dialog>
