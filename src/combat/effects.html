<section id="effects" data-view-scroll="active-effects" aria-labelledby="effects-heading">
  <div class="rail-heading"><h2 id="effects-heading">Active effects</h2><button type="button" id="add-effect">Add effect</button></div>
  <article id="effect-concentration" hidden><span class="status-chip" data-status-kind="concentration">Concentration</span><h3 id="effect-concentration-name"></h3><p id="effect-concentration-duration"></p><button type="button" id="effect-end-concentration">End concentration</button></article>
  <div class="focus-form effect-tools">
    <details class="effect-time-controls" data-view-disclosure="effect-clock"><summary>Advance game time</summary>
    <form id="effect-clock" class="focus-form">
      <label>Elapsed game time <input name="elapsed" type="number" min="1" max="4294967295" value="1" required></label>
      <label for="effect-clock-unit">Game time unit</label>
      <select id="effect-clock-unit" name="unit"><option value="1">Seconds</option><option value="60">Minutes</option><option value="3600">Hours</option><option value="rounds">Rounds (6 seconds each)</option></select>
      <button>Advance game time</button>
    </form>
    </details>
  </div>
  <p id="effect-feedback" role="status"></p>
  <div id="effect-list" class="companion-grid"></div>
  <details id="ended-effects" class="panel" data-view-disclosure="ended-effects" hidden>
    <summary>Ended effects</summary>
    <div id="ended-effect-list" class="panel-body companion-grid"></div>
  </details>
</section>
<dialog id="effect-editor" aria-labelledby="effect-heading">
  <form id="effect-form">
    <h2 id="effect-heading">Ongoing effect</h2>
    <div class="companion-fields">
      <label>Effect name <input name="name" maxlength="120" placeholder="Berserk" required></label>
      <label>Type <select name="category"><option value="effect">Effect</option><option value="condition">Condition</option></select></label>
      <div><label for="effect-target">Applies to</label><select id="effect-target" name="target"></select></div>
      <div><label for="effect-kind">Ends after</label>
        <select id="effect-kind" name="kind"><option value="manual">Manually ended</option><option value="rounds">Combat rounds</option><option value="seconds">In-game time</option><option value="start">Start of turn</option><option value="end">End of turn</option><option value="short">Short or long rest</option><option value="long">Long rest</option></select>
      </div>
      <label id="effect-amount">Remaining <input name="remaining" type="number" min="1" max="4294967295" value="1"></label>
      <div id="effect-time-unit"><label for="effect-duration-unit">Duration unit</label>
        <select id="effect-duration-unit" name="unit"><option value="1">Seconds</option><option value="60">Minutes</option><option value="3600">Hours</option></select>
      </div>
      <div id="effect-anchor"><label for="effect-turn">Whose turn</label><select id="effect-turn" name="anchor"></select></div>
      <label class="companion-wide">Condition, modifier, or notes <textarea name="notes" rows="3" maxlength="2000"></textarea></label>
    </div>
    <div class="focus-form companion-edit-actions">
      <button type="button" id="effect-cancel">Cancel</button>
      <button>Save effect</button>
    </div>
  </form>
</dialog>
