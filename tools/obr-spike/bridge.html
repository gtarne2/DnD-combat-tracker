<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora bridge spike</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #1e1e24; color: #eee; }
  code { color: #9cf; }
  #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; }
</style>
</head>
<body>
<p><strong>Aurora bridge spike, option 2 (pop-up window).</strong> Keep this window open while you test.</p>
<div id="log"></div>
<script>
"use strict";
// This page is served by the local spike server, so its fetches are same-origin.
// It relays messages between the Owlbear extension (its opener) and the server.
const ALLOWED = ["https://raw.githack.com", "http://localhost:47800", "http://127.0.0.1:47800"];
const logEl = document.getElementById("log");
const log = (line) => { logEl.textContent += line + "\n"; };
const target = new URLSearchParams(location.search).get("origin");

async function ping() {
  const started = performance.now();
  try {
    const res = await fetch("/ping", { cache: "no-store" });
    return { ok: res.ok, status: res.status, body: await res.json(), ms: Math.round(performance.now() - started) };
  } catch (error) {
    return { ok: false, error: `${error.name}: ${error.message}` };
  }
}

async function main() {
  if (!ALLOWED.includes(target)) {
    log(`Refusing to talk to origin ${target}. Open this page from the test extension.`);
    return;
  }
  if (!window.opener) {
    log("No opener: the extension's link to this window was cut (noopener or sandbox).");
    return;
  }
  window.addEventListener("message", async (event) => {
    if (event.origin !== target || event.source !== window.opener) return;
    const msg = event.data || {};
    if (msg.type === "ping") {
      window.opener.postMessage({ type: "pong", id: msg.id, result: await ping() }, target);
      log("Answered a ping from the extension.");
    } else if (msg.type === "results") {
      let reply;
      try {
        const res = await fetch("/results", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(msg.body),
        });
        reply = { ok: res.ok, body: await res.json() };
      } catch (error) {
        reply = { ok: false, error: `${error.name}: ${error.message}` };
      }
      window.opener.postMessage({ type: "results-saved", id: msg.id, result: reply }, target);
      log(reply.ok ? "Saved the results." : "Saving the results failed.");
    }
  });
  window.opener.postMessage({ type: "bridge-ready", ping: await ping() }, target);
  log(`Connected to the extension at ${target}.`);
}
main();
</script>
</body>
</html>
