[package]
name = "aurora-combat-tracker"
version = "0.1.0"
edition = "2024"
default-run = "combat-sheet"

[dependencies]
roxmltree = "0.21"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

# The party helper runs on Windows and, for players, on macOS. Only DPAPI is Windows-only.
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography"] }
